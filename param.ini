"""	参数说明	"""
rgbLocation			# 像素排布类型
frameHZ				# 刷新频率
curveFlag   		# 是否为曲面（0：平面；1：曲面；与powerOff边缘反光屏蔽宽度相关）
boundaryColLR  		# 左右曲面边缘矫正宽度（如果设置为boundaryColLR+灰阶等级：只对当前灰阶进行矫正）
boundaryColUD 		# 上下曲面边缘矫正宽度（如果设置为boundaryColUD+灰阶等级：只对当前灰阶进行矫正）
boundaryCorrectType	# 曲面边缘矫正方法（0：每个灰阶单独计算矫正系数，1：参考指定灰阶计算矫正系数，一般是最高灰阶,2:Fix2_5dCurvedEdgeV2）
boundaryCorrectGray	# 曲面边缘方法设置为1时参考灰阶
correctR			# 是否进行R角发暗矫正（0：关闭；1：开启）
widthR				# R角矫正宽度(correctR开启时调用)
resizeType			# 像素还原的方法 0：W252矩阵还原 1：W252矩阵还原 2：非矩阵还原
powerOffType		# 提取灰尘过滤方法（0：从打光画面过滤；1：从亮画面过滤，不需要打光）

bayerFlag    	# 非dll参数，跑代码用：是否为Bayer图像输入
outPutType		# 非dll参数，跑代码用：输出类型 （0：csv；1:bmp；2:tiff）
RoiDetIOType	# 非dll参数，跑代码用：ROI检测方法 （0: 定位图；1：常规图直线拟合）
xmlPath			# 非dll参数，跑代码用：xml路径

Gain			# 增益系数设定；1、设定方法：在Gain下设置gray+当前灰阶=增益系数  2、增益系数计算方法：同一画面同一曝光时间下，设定增益获取的平均灰度/相机默认增益获取的平均灰度
"""	参数说明	"""

[IO_Param]
rgbLocation=0
frameHZ=120
curveFlag=0
boundaryColLR=0
boundaryColUD=0
gammaGainL=1
gammaGainR=1
gammaGainU=1
gammaGainD=1
boundaryCorrectType=0
boundaryCorrectGray=128
correctR=0
widthR=30
resizeType=2
powerOffType=0
cameraType=0

[Main_Param]
readImgMode=0
RoiDetIOType=0
outPutFormat=tiff
xmlPath=xml\TMSC0HD057_MR4.xml

[Gain]

[CU_Param]
thr_lower=1
thr_uper=1
factor_lower=1
factor_middle=1
factor_uper=1






